# fly.toml app configuration file generated for cast-io on 2026-10-14T22:19:09+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cast-io'
primary_region = 'arn'

# A deploy waits for ranked matches under way to finish (RANKED.shutdownDrainMs, 240 s) before
# the server exits: give it Fly's maximum before it is killed. Top-level, like every app-wide
# setting: below a [table] header it would belong to that table, and Fly would ignore it.
kill_timeout = 300

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '2567'
  # Accounts and ratings: on the volume below, so deploys don't wipe them.
  DB_FILE = '/data/ligma.db'
  PUBLIC_URL = 'https://cast-io.fly.dev'

# Created once with: fly volumes create ligma_data --region arn --size 1
# A volume belongs to one machine, and the server keeps ranked state in one process: run exactly one machine.
[mounts]
  source = 'ligma_data'
  destination = '/data'

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/hi'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
